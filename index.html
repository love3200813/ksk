<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加山記點餐</title>
<style>
/* 奶油風追蹤條優化 */
#orderTrackerBar {
  background-color: #FFF9E6; 
  border-bottom: 2px solid #F3E5AB;
  padding: 15px;
  text-align: center;
  position: relative; 
  z-index: 9999;
  font-family: "Microsoft JhengHei", sans-serif;
  display: none; 
}
#orderTrackerBar span {
  color: #5D4037;
  font-weight: bold;
  font-size: 15px;
}
#orderTrackerBar .track-btn {
  background-color: #111;
  color: white;
  padding: 6px 15px;
  border-radius: 20px;
  margin-left: 10px;
  font-size: 13px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}
:root{
  --bg:#f5f5f2; --panel:#ffffff; --line:#e7e7e7; --text:#1b1b1b;
  --muted:#7a7a7a; --primary:#111111; --success:#1f8f55; --danger:#d9534f;
  --warning:#d98b00; --info:#2563eb; --shadow:0 10px 24px rgba(0,0,0,.06); --radius:18px;
}
*{box-sizing:border-box;}
html,body{ margin:0; padding:0; font-family:"Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--text); }
.page{ display:none; max-width:1100px; margin:0 auto; min-height:100vh; padding:18px 16px 40px; }
.active{ display:block; }
.topbar{ position:sticky; top:0; z-index:100; background:rgba(245,245,242,.92); backdrop-filter:blur(10px); padding-bottom:12px; }
.topbar-inner{ display:flex; justify-content:space-between; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:14px 16px; box-shadow:var(--shadow); }
.brand-title{ font-size:26px; font-weight:900; }
.top-chip{ background:#f3f3f3; border-radius:999px; padding:8px 12px; font-size:13px; color:#555; }
.btn{ border:none; border-radius:14px; padding:14px 16px; font-size:16px; font-weight:900; cursor:pointer; transition:.18s; }
.btn-primary{ background:var(--primary); color:#fff; }
.btn-secondary{ background:#f1f1f1; color:#222; }
.btn-block{ width:100%; }
.mode-switch{ display:flex; gap:12px; margin:18px 0 16px; }
.mode-btn{ flex:1; border:none; border-radius:16px; padding:15px; background:#ececec; font-weight:900; cursor:pointer; }
.mode-btn.active{ background:#111; color:#fff; }
.combo-step{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:var(--shadow); margin-bottom:16px; }
.step-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
.menu-card{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px; cursor:pointer; transition:.18s; }
.menu-card.active{ border-color:#111; background:#f9f9f9; box-shadow: inset 0 0 0 1px #111; }
.menu-img { width:100%; height:130px; object-fit:cover; border-radius:12px; margin-bottom:10px; background:#f0f0f0; }
.step-lock{ opacity:.4; pointer-events:none; }
.step-chip{ border-radius:999px; padding:7px 12px; font-size:13px; font-weight:900; background:#f2f2f2; color:#555; }
.step-chip.ok{ background:#ecfdf3; color:#15803d; }
.cart-item-box { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 40px 12px 12px; margin-bottom: 10px; position: relative; border-left: 5px solid #111; word-break: break-all; }
.del-btn { position: absolute; top: 10px; right: 10px; color: var(--danger); cursor: pointer; font-weight: bold; }
.inline-summary{ margin-top:18px; background:#fff; border:2px solid var(--primary); border-radius:20px; padding:18px; box-shadow:var(--shadow); }
.modal{ position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; z-index:200; padding:16px; }
.modal.show{ display:flex; }
.modal-card{ width:min(100%,520px); background:#fff; border-radius:18px; padding:20px; }
.toast{ position:fixed; left:50%; top:20px; transform:translateX(-50%); background:#111; color:#fff; padding:12px 16px; border-radius:14px; z-index:500; display:none; }
input, select { width:100%; border:1px solid var(--line); border-radius:14px; padding:14px; font-size:16px; margin-bottom:10px; }
</style>
</head>
<body>

<div id="orderTrackerBar">
  <span id="trackerText"></span>
  <button type="button" class="track-btn" onclick="autoQueryLastOrder()">點此查進度 ➔</button>
  <span style="margin-left:15px; cursor:pointer; color:#999; font-size: 20px;" onclick="this.parentElement.style.display='none'">✕</span>
</div>

<div id="toast" class="toast"></div>

<div id="orderPage" class="page active">
  <div id="entryPortal" style="position:fixed; inset:0; background:#f5f5f2; z-index:2000; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;">
    <h1 style="margin-bottom:30px; font-weight:900; color:#111;">🍲 加山記 Kashan Kee</h1>
    <p style="margin-bottom:40px; color:#666; font-size:18px;">請選擇您的點餐方式</p>
    
    <button type="button" class="btn btn-primary btn-block" style="margin-bottom:20px; padding:30px; font-size:22px; border-radius:20px; box-shadow:var(--shadow);" onclick="chooseServiceMode('pickup')">
      🏠 門市現場 / 預約自取
    </button>
    
    <button type="button" class="btn btn-secondary btn-block" style="padding:30px; font-size:22px; border:2px solid #111; border-radius:20px; background:#fff; box-shadow:var(--shadow);" onclick="chooseServiceMode('delivery')">
      🚚 低溫宅配到府
    </button>
    
    <p style="margin-top:40px; font-size:14px; color:#999;">(宅配運費固定 $190，滿額享免運優惠)</p>
  </div>

  <div class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand-title">🍲 加山記 Kashan Kee stew</div>
        <div style="font-size:13px; color:var(--muted);">加入購物車後可點下一份，最後統一結帳</div>
      </div>
      <div class="top-actions">
        <div class="top-chip">目前總計｜$<b id="cartTotalTop">0</b></div>
        <button class="btn btn-secondary" onclick="openQueryModal()">查詢訂單</button>
      </div>
    </div>
  </div>

  <div class="mode-switch">
    <button id="modeComboBtn" class="mode-btn" onclick="setOrderMode('combo')" style="display:none;">超值套餐</button>
    <button id="modeSingleBtn" class="mode-btn active" onclick="setOrderMode('single')">輕鬆單點</button>
  </div>

  <div id="comboModeWrap" style="display:none;">
    <div id="comboStep1" class="combo-step">
      <div class="step-head">
        <div class="brand-title" style="font-size:20px;">1. 選擇主餐</div>
        <span id="stepMainChip" class="step-chip">請選擇</span>
      </div>
      <div id="mainGrid" class="grid"></div>
    </div>

    <div id="comboOptionsWrap" class="combo-step step-lock" style="display:none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed var(--line);">
        <button class="btn btn-secondary" onclick="resetCombo()" style="padding: 8px 12px; font-size: 14px;">🔙 返回重選主餐</button>
        <div style="font-weight: 900; color: var(--danger); font-size: 18px;" id="selectedMainDisplay"></div>
      </div>
      <div class="brand-title" style="font-size:20px; margin-bottom:15px;">2. 套餐配項</div>
      <div style="margin-bottom:15px;">
        <label style="font-weight:900; display:block; margin-bottom:5px;">主餐加料 (選填)</label>
        <select id="comboAddonSelect" onchange="syncComboSelection()"></select>
      </div>
      <div style="margin-bottom:15px;">
        <label style="font-weight:900; display:block; margin-bottom:5px;">選擇飲料</label>
        <select id="comboDrinkSelect" onchange="syncComboSelection()"></select>
      </div>
      <div style="margin-bottom:15px;">
        <label style="font-weight:900; display:block; margin-bottom:5px;">選擇副餐</label>
        <select id="comboSideSelect" onchange="syncComboSelection()"></select>
      </div>
      <div style="padding:10px; background:#fffceb; border-radius:12px; border:1px solid #ffeeba; text-align:right;">
        <span style="font-weight:bold; color:#856404;">套餐小計：$</span>
        <span id="currentComboPrice" style="font-size:24px; font-weight:900; color:var(--danger);">0</span>
      </div>
    </div>
  </div>

  <div id="singleModeWrap" style="display:block;">
    <div id="singleMenuWrap"></div>
  </div>

  <div class="inline-summary" style="border-color: #111; background: #fff;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <div class="brand-title" style="font-size:20px;">🍱 當前餐點小計</div>
      <div style="font-size:26px; font-weight:900; color:var(--danger);">$<span id="currentComboPriceDisplay">0</span></div>
    </div>
    <button class="btn btn-secondary btn-block" style="background:#111; color:#fff;" onclick="addToBasket()">＋加入購物車 (點完請按此)</button>
  </div>

  <div id="cartSection" style="margin-top:20px; display:none;">
    <div class="brand-title" style="font-size:20px; margin-bottom:10px;">🛒 已加入清單</div>
    <div id="basketItemsList"></div>
    <div style="height: 100px;"></div> 
  </div>
  
  <div id="stickyCheckoutBar" style="position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,0.96); backdrop-filter:blur(10px); border-top:2px solid #111; padding:15px 20px; display:none; z-index:999; box-shadow: 0 -5px 20px rgba(0,0,0,0.1);">
    <div style="max-width:1100px; margin:0 auto; display:flex; justify-content:space-between; align-items:center;">
      <div>
        <div style="font-size:14px; color:#666; font-weight:bold;">共 <span id="cartQty">0</span> 份餐點</div>
        <div style="font-size:24px; font-weight:900; color:var(--danger);">$<span id="cartTotalBottom">0</span></div>
      </div>
      <button id="goCheckoutBtn" class="btn btn-primary" style="padding:12px 40px; font-size:18px;" onclick="showCheckout()">確認結帳 ➔</button>
    </div>
  </div>

  <div id="checkoutPanel" class="combo-step" style="display:none; margin-top:20px; background:#fdfdfd; border:2px solid var(--info);">
    <h2 class="brand-title" style="margin-bottom:15px;">步驟 2：確認資料</h2>
    <div id="checkoutItemsDisplay" style="margin-bottom:15px; background:#fff; padding:12px; border-radius:12px; border:1px solid var(--line);"></div>
    
    <label style="font-weight:900;">取餐方式</label>
    <select id="pickupMode" onchange="handlePickupModeChange()">
      <option value="onsite">現場取餐（盡快）</option>
      <option value="reserve">預約取餐</option>
    </select>

    <div id="reserveFields" style="display:none;">
      <label style="font-weight:900;">預約日期</label>
      <select id="pickupDate" onchange="updatePickupTimeOptions()"></select>
      <label style="font-weight:900;">預約時間</label>
      <select id="pickupTime"></select>
    </div>

    <label style="font-weight:900;">付款方式</label>
    <select id="payMethod">
      <option value="LINEPAY">LINE Pay</option>
      <option value="現金">現場付款</option>
    </select>

    <label style="font-weight:900;">聯絡姓名</label>
    <input type="text" id="customerName" placeholder="請輸入姓名">
    <label style="font-weight:900;">聯絡電話</label>
    <input type="tel" id="customerPhone" placeholder="請輸入電話">
    
    <div id="deliveryAddressSection" style="display:none; margin-top:15px; padding:15px; background:#fff5f5; border-radius:14px; border:1px solid #ffcccc;">
      <label style="font-weight:900; color:#d9534f; display:block; margin-bottom:8px;">🚚 收件完整地址</label>
      <input type="text" id="deliveryAddress" placeholder="請輸入縣市、行政區、道路與門牌號碼">
      <div style="font-size:12px; color:#e74c3c; margin-top:5px;">※ 低溫宅配僅限燉湯品項，請填寫正確收件資訊。</div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:15px;">
      <button class="btn btn-secondary" onclick="hideCheckout()">返回點餐</button>
      <button id="submitBtn" class="btn btn-primary" onclick="submitOrder()">確認送出訂單</button>
    </div>
  </div>
</div>

<div id="successPage" class="page">
    <div class="combo-step" style="text-align:center;">
        <h2 class="brand-title">✅ 訂單成立:請稍後等待取餐號碼顯示</h2>
        <div id="successDetail" style="margin:20px 0; line-height:2; font-size:18px;"></div>
        <button class="btn btn-primary" onclick="location.reload()">再點一筆/返回首頁查詢訂單狀態</button>
    </div>
</div>

<div id="queryModal" class="modal">
  <div class="modal-card">
    <div class="step-head">
      <div class="brand-title">🔍 查詢訂單</div>
      <button class="btn" style="padding:5px 10px; width:auto;" onclick="closeQueryModal()">✕</button>
    </div>
    <input type="text" id="queryInput" placeholder="請輸入取餐號 (例如：#001或#P001)">
    <div style="font-size:13px; color:#888; margin-bottom:15px; margin-top:-5px;">
      💡 範例：請輸入取餐號 <b>#001或#P001</b> 或是訂單編號 <b>RW123456789</b>
    </div>
    <button class="btn btn-primary btn-block" onclick="queryOrder()">送出查詢</button>
    <div id="queryResult" style="margin-top:15px;"></div>
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
let serviceMode = "pickup"; 
const GAS_API = "https://script.google.com/macros/s/AKfycbzZHIyddAlXhrUcCjE43-8vfR9Sm4tHas7t1F1Y4OyCuQtRxKSvOa2S4tQMwrq-NOvu/exec";
const BUSINESS_OPEN = { h:17, m:0 };
const BUSINESS_CLOSE = { h:23, m:0 };
const MIN_RESERVE_MINUTES = 60;

let COMBO_MAINS = [], COMBO_DRINKS = [], COMBO_SIDES = [], COMBO_ADDONS = [];
let customerLineId = "", basket = [], orderMode = "single", singleSelection = {}; 
let curCombo = { main: null, drink: null, side: null, addons: [] };

function chooseServiceMode(mode) {
  serviceMode = mode;
  document.getElementById("entryPortal").style.display = "none";
  if (mode === 'delivery') {
    setOrderMode('single'); 
    document.querySelector(".mode-switch").style.display = "none"; 
    renderSingleUI(); 
    showToast("已進入宅配專區");
  } else {
    document.querySelector(".mode-switch").style.display = "flex"; 
    renderSingleUI(); 
  }
}

// 🛑 【重大修復】：強制抓取後台來的 singlePrice 屬性，確保金額不再是 $0
function renderSingleUI() {
  let categories = [];
  if (serviceMode === 'delivery') {
    const filteredDrinks = COMBO_DRINKS.filter(item => item.isDelivery === "Y");
    categories = [{ 
      name: "🚚 低溫宅配專區", 
      list: filteredDrinks.map(d => ({ n: d.n, p: Number(d.singlePrice) || Number(d.sp) || 0, img: d.img })) 
    }];
  } else {
    categories = [
      { name: "🍚 養生主食單點", list: COMBO_MAINS.map(m => ({ n: m.n, p: Number(m.singlePrice) || Number(m.sp) || 0, img: m.img })) },
      { name: "🍲 招牌燉品單點", list: COMBO_DRINKS.map(d => ({ n: d.n, p: Number(d.singlePrice) || Number(d.sp) || 0, img: d.img })) },
      { name: "🥗 精選小菜單點", list: COMBO_SIDES.map(s => ({ n: s.n, p: Number(s.singlePrice) || Number(s.sp) || 0, img: s.img })) }
    ];
  }
  
  document.getElementById("singleMenuWrap").innerHTML = categories.map(cat => `
    <div class="combo-step"><div class="brand-title" style="font-size:18px; margin-bottom:12px;">${cat.name}</div><div class="grid">
        ${cat.list.map(i => `<div class="menu-card">${i.img ? `<img src="${i.img}" class="menu-img">` : ''}<b>${i.n}</b><br><span style="color:var(--danger); font-weight:900;">$${i.p}</span>
            <div style="display:flex; align-items:center; gap:10px; margin-top:10px;"><button class="btn" style="padding:5px 10px;" onclick="changeSingle('${i.n}', -1, ${i.p})">-</button><b id="single-qty-${i.n}">${singleSelection[i.n]?.q || 0}</b><button class="btn" style="padding:5px 10px;" onclick="changeSingle('${i.n}', 1, ${i.p})">+</button></div>
          </div>`).join("")}
      </div></div>`).join("");
}

function showCheckout() {
  let subtotal = basket.reduce((sum, item) => sum + item.price, 0);
  let shippingFee = (serviceMode === 'delivery') ? 190 : 0; 
  let finalTotal = subtotal + shippingFee;

  const addrSec = document.getElementById("deliveryAddressSection");
  if (serviceMode === 'delivery') {
    if(addrSec) addrSec.style.display = "block";
    document.getElementById("pickupMode").innerHTML = `<option value="delivery_cold">低溫宅配</option>`;
    document.getElementById("pickupMode").disabled = true; 
  } else {
    if(addrSec) addrSec.style.display = "none";
    document.getElementById("pickupMode").innerHTML = `<option value="onsite">現場取餐（盡快）</option><option value="reserve">預約取餐</option>`;
    document.getElementById("pickupMode").disabled = false;
  }

  let listHtml = basket.map(i => `<div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>• ${i.desc}</span> <span>$${i.price}</span></div>`).join("");
  if (shippingFee > 0) listHtml += `<hr style="border:0; border-top:1px dashed #ccc;"><div style="display:flex; justify-content:space-between; color:#d9534f; font-weight:bold;"><span>🚚 低溫宅配運費</span> <span>$${shippingFee}</span></div>`;
  listHtml += `<div style="text-align:right; font-size:22px; font-weight:900; margin-top:10px; border-top:2px solid #111; padding-top:10px;">總計：$${finalTotal}</div>`;
  document.getElementById("checkoutItemsDisplay").innerHTML = listHtml;

  ['.mode-switch', '#comboModeWrap', '#singleModeWrap', '.inline-summary', '#cartSection', '#stickyCheckoutBar'].forEach(s => { const el = document.querySelector(s); if(el) el.style.display = 'none'; });
  document.getElementById("checkoutPanel").style.display = "block";
  window.scrollTo({top: 0, behavior:'smooth'});
}

function hideCheckout() { 
  document.getElementById("checkoutPanel").style.display = "none"; 
  document.querySelector(".mode-switch").style.display = (serviceMode === 'delivery') ? "none" : "flex";
  document.querySelector(".inline-summary").style.display = "block";
  setOrderMode(orderMode); updateBasketUI(); window.scrollTo({top: 0, behavior:'smooth'});
}

async function submitOrder() {
  const name = document.getElementById("customerName").value.trim();
  const phone = document.getElementById("customerPhone").value.trim();
  const address = document.getElementById("deliveryAddress").value.trim();
  const payMethod = document.getElementById("payMethod").value;
  
  if (payMethod === "LINEPAY" && (!name || !phone)) return alert("請填寫聯絡姓名與電話！");
  if (serviceMode === 'delivery' && !address) return alert("請填寫宅配收件地址！");

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.innerText = "送出中...";
  
  let pickup = "現場取餐";
  if(serviceMode === 'delivery') pickup = "delivery_cold";
  else if(document.getElementById("pickupMode").value === 'reserve') pickup = document.getElementById("pickupDate").value + " " + document.getElementById("pickupTime").value;

  const orderData = {
    items: basket.map(i=>i.desc + " x" + i.qty).join(" | "),
    total: basket.reduce((s,i)=>s+i.price, 0) + (serviceMode === 'delivery' ? 190 : 0),
    pickupTime: pickup, payMethod: payMethod, customerName: name, customerPhone: phone, deliveryAddress: address, lineUserId: customerLineId
  };

  try {
    const res = await fetch(GAS_API + "?action=submitOrder&orderData=" + encodeURIComponent(JSON.stringify(orderData)));
    const json = await res.json();
    if (json.error) { alert("後台錯誤：" + json.message); btn.disabled = false; return; }
    localStorage.setItem("ksk_last_order", JSON.stringify({ seq: json.seq || "", orderId: json.orderId || "", time: new Date().getTime() }));

    if(json.payUrl) location.href = json.payUrl;
    else if(json.status === "success") {
      document.getElementById("orderPage").style.display='none'; document.getElementById("successPage").style.display='block';
      document.getElementById("successDetail").innerHTML = `取餐號：<b style="font-size:32px; color:var(--danger);">${json.seq}</b>`;
    }
  } catch(e) { alert("系統連線錯誤：" + e.message); btn.disabled = false; }
}

async function initializeLiff() {
  try {
    await liff.init({ liffId: "2009556012-RFm3NtRY" }); 
    const profile = await liff.getProfile(); customerLineId = profile.userId;
    if(document.getElementById("customerName")) document.getElementById("customerName").value = profile.displayName;
  } catch (err) { console.error("LIFF 失敗:", err); }
}

async function fetchMenuData() {
  try {
    const res = await fetch(GAS_API + "?action=getMenu&t=" + Date.now());
    const menuData = await res.json();
    COMBO_MAINS = menuData.mains; COMBO_DRINKS = menuData.drinks; COMBO_SIDES = menuData.sides; COMBO_ADDONS = menuData.addons;
    renderComboUI(); renderSingleUI();
  } catch(err) { alert("菜單載入失敗：" + err.message); }
}

function setOrderMode(m) {
  orderMode = m;
  document.getElementById("modeComboBtn").classList.toggle("active", m==='combo'); document.getElementById("modeSingleBtn").classList.toggle("active", m==='single');
  document.getElementById("comboModeWrap").style.display = m==='combo'?'block':'none'; document.getElementById("singleModeWrap").style.display = m==='single'?'block':'none';
}

function changeSingle(n, d, p) {
  if(!singleSelection[n]) singleSelection[n] = { q:0, p:p };
  singleSelection[n].q += d; if(singleSelection[n].q <= 0) delete singleSelection[n];
  const el = document.getElementById(`single-qty-${n}`); if(el) el.innerText = singleSelection[n]?.q || 0;
  let singleSum = 0; Object.keys(singleSelection).forEach(k => { singleSum += singleSelection[k].q * singleSelection[k].p; });
  document.getElementById("currentComboPriceDisplay").innerText = singleSum;
}

function addToBasket() {
  if (orderMode === "combo") {
    if(!curCombo.main) return alert("請先選擇主餐！");
    const total = curCombo.main.comboPrice + curCombo.drink.extra + curCombo.side.extra + curCombo.addons.reduce((s,a)=>s+a.p, 0);
    basket.push({ desc: `套餐:${curCombo.main.n}`, price: total, unitPrice: total, qty: 1 });
    resetCombo();
  } else {
    const keys = Object.keys(singleSelection);
    if(keys.length===0) return alert("請先選擇品項！");
    keys.forEach(k => { basket.push({ desc: `單點:${k}`, price: singleSelection[k].p * singleSelection[k].q, unitPrice: singleSelection[k].p, qty: singleSelection[k].q }); });
    singleSelection = {}; renderSingleUI(); document.getElementById("currentComboPriceDisplay").innerText = "0";
  }
  showToast("已加入購物車"); updateBasketUI();
}

function updateCartQty(index, delta) {
  const item = basket[index]; if (!item) return;
  if (!item.unitPrice) item.unitPrice = item.price / (item.qty || 1);
  const newQty = (item.qty || 1) + delta;
  if (newQty <= 0) { if (confirm("移除餐點？")) { basket.splice(index, 1); updateBasketUI(); } }
  else { item.qty = newQty; item.price = item.unitPrice * newQty; updateBasketUI(); }
}

function updateBasketUI() {
  const list = document.getElementById("basketItemsList");
  if (basket.length === 0) {
    document.getElementById("cartSection").style.display = "none"; document.getElementById("stickyCheckoutBar").style.display = "none"; document.getElementById("cartTotalTop").innerText = "0"; return;
  }
  let totalSum = 0, totalItems = 0;
  list.innerHTML = basket.map((item, i) => {
    totalSum += item.price; totalItems += item.qty;
    return `<div class="cart-item-box" style="display:flex; justify-content:space-between; align-items:center;"><div style="flex:1;"><b>${item.desc}</b><br><span style="color:var(--danger); font-weight:bold;">$${item.price}</span></div><div style="display:flex; align-items:center; gap:8px; background:#f8f8f8; border-radius:10px; padding:4px 8px;"><button class="btn" style="padding:2px 8px; background:none; color:#333;" onclick="updateCartQty(${i}, -1)">-</button><b>${item.qty}</b><button class="btn" style="padding:2px 8px; background:none; color:#333;" onclick="updateCartQty(${i}, 1)">+</button></div><span class="del-btn" style="position:static; margin-left:15px;" onclick="removeItem(${i})">✕</span></div>`;
  }).join("");
  document.getElementById("cartQty").innerText = totalItems; document.getElementById("cartTotalBottom").innerText = totalSum; document.getElementById("cartTotalTop").innerText = totalSum;
  document.getElementById("cartSection").style.display = "block"; document.getElementById("stickyCheckoutBar").style.display = "block";
}

function removeItem(i) { basket.splice(i,1); updateBasketUI(); }
function handlePickupModeChange() {
  const mode = document.getElementById("pickupMode").value; const resF = document.getElementById("reserveFields");
  if(mode==='onsite') { resF.style.display='none'; } else { resF.style.display='block'; initDateOptions(); }
}
function initDateOptions() {
  const s = document.getElementById("pickupDate"); const now = getTaipeiNow();
  s.innerHTML = [0,1,2].map(i => { const d = new Date(now.getTime() + i*24*60*60*1000); const val = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; return `<option value="${val}">${i===0?'今天':(i===1?'明天':'後天')} (${val})</option>`; }).join("");
  updatePickupTimeOptions();
}
function updatePickupTimeOptions() {
  const dateStr = document.getElementById("pickupDate").value; const s = document.getElementById("pickupTime"); const now = getTaipeiNow(); const minT = new Date(now.getTime() + MIN_RESERVE_MINUTES*60000);
  let options = []; let cur = new Date(dateStr + "T17:00:00"); const end = new Date(dateStr + "T23:00:00");
  while(cur <= end) { if(cur >= minT) options.push(pad(cur.getHours())+":"+pad(cur.getMinutes())); cur = new Date(cur.getTime() + 30*60000); }
  s.innerHTML = options.length ? options.map(t=>`<option value="${t}">${t}</option>`).join("") : `<option value="">無可用時段</option>`;
}
function getTaipeiNow() { return new Date(new Date().toLocaleString("en-US", {timeZone:"Asia/Taipei"})); }
function pad(n) { return String(n).padStart(2,'0'); }
function showToast(m) { const t = document.getElementById("toast"); t.innerText = m; t.style.display = "block"; setTimeout(() => t.style.display = "none", 2500); }
function openQueryModal() { document.getElementById("queryModal").classList.add("show"); }
function closeQueryModal() { document.getElementById("queryModal").classList.remove("show"); }
async function queryOrder() {
  let id = document.getElementById("queryInput").value.trim();
  if (!id) return alert("請輸入號碼");
  if (/^\d+$/.test(id)) id = "#" + id.padStart(3, "0");
  document.getElementById("queryResult").innerHTML = "查詢中...";
  try {
    const res = await fetch(GAS_API + "?action=checkMyOrder&id=" + encodeURIComponent(id) + "&t=" + Date.now());
    const json = await res.json();
    document.getElementById("queryResult").innerHTML = !json ? "查無此訂單" : `<div style="padding:15px; background:#f9f9f9; border-radius:12px; border-left: 5px solid var(--info);"><b>取餐號：${json.seqId}</b><br>狀態：${json.status}<br>內容：${json.items}</div>`;
  } catch(e) { document.getElementById("queryResult").innerHTML = "查詢失敗"; }
}

async function checkLinePayReturn() {
  const urlParams = new URLSearchParams(window.location.search);
  const status = urlParams.get('status'); const orderId = urlParams.get('orderId');
  if (status === 'success' && orderId) {
    document.getElementById("orderPage").style.display = 'none'; document.getElementById("successPage").style.display = 'block';
    const detailDiv = document.getElementById("successDetail");
    detailDiv.innerHTML = `付款已完成！<br><span style="color:#888; font-size:16px;">正在為您讀取取餐號碼，請稍候...</span>`;
    try {
      const res = await fetch(GAS_API + "?action=checkMyOrder&id=" + orderId + "&t=" + Date.now());
      const json = await res.json();
      if (json && json.seqId) detailDiv.innerHTML = `LINE Pay 付款成功！<br>取餐號：<b style="font-size:36px; color:var(--danger);">${json.seqId}</b><br><span style="font-size:14px; color:#666;">訂單ID：${orderId}</span>`;
      else detailDiv.innerHTML = `付款成功！<br>您的訂單編號：<b>${orderId}</b><br><span style="font-size:16px;">請將此編號出示給店員即可取餐。</span>`;
    } catch (e) { detailDiv.innerHTML = `網路較慢，請截圖此畫面<br>您的訂單編號：<b>${orderId}</b>`; }
    window.history.replaceState(null, null, window.location.pathname);
  }
}

initializeLiff(); fetchMenuData(); checkLinePayReturn();

window.addEventListener('load', function() {
  const lastOrderStr = localStorage.getItem("ksk_last_order");
  if (lastOrderStr) {
    const lastOrder = JSON.parse(lastOrderStr);
    if (new Date().getTime() - lastOrder.time < 86400000) {
      document.getElementById("trackerText").innerText = "您有一筆訂單 [" + lastOrder.seq + "]";
      document.getElementById("orderTrackerBar").style.display = 'block';
    }
  }
});
function autoQueryLastOrder() {
  const lastOrder = JSON.parse(localStorage.getItem("ksk_last_order"));
  if (lastOrder) { document.getElementById("queryInput").value = lastOrder.seq; openQueryModal(); queryOrder(); }
}
function renderComboUI() {
  document.getElementById("mainGrid").innerHTML = COMBO_MAINS.map(m => `<div class="menu-card" onclick="selectMain('${m.code}')">${m.img ? `<img src="${m.img}" class="menu-img">` : ''}<b>${m.code}. ${m.n}</b><br><small>套餐價 $${m.comboPrice}</small></div>`).join("");
  document.getElementById("comboAddonSelect").innerHTML = '<option value="">(不加料)</option>' + COMBO_ADDONS.map(a => `<option value="${a.n}">+ $${a.p} ${a.n}</option>`).join("");
  document.getElementById("comboDrinkSelect").innerHTML = COMBO_DRINKS.map(d => `<option value="${d.n}">${d.n} ${d.extra > 0 ? '(+ $'+d.extra+')' : '(內含)'}</option>`).join("");
  document.getElementById("comboSideSelect").innerHTML = COMBO_SIDES.map(s => `<option value="${s.n}">${s.n} ${s.extra > 0 ? '(+ $'+s.extra+')' : '(內含)'}</option>`).join("");
}
function selectMain(c) {
  curCombo.main = COMBO_MAINS.find(x => x.code === c);
  document.getElementById("comboStep1").style.display = "none"; document.getElementById("comboOptionsWrap").style.display = "block";
  document.getElementById("selectedMainDisplay").innerText = curCombo.main.n;
  window.scrollTo({top: 0, behavior: 'smooth'}); renderComboUI(); syncComboSelection();
}
function syncComboSelection() {
  if (!curCombo.main) return;
  const addonObj = COMBO_ADDONS.find(a => a.n === document.getElementById("comboAddonSelect").value) || { n: "", p: 0 };
  const drinkObj = COMBO_DRINKS.find(d => d.n === document.getElementById("comboDrinkSelect").value) || { n: "未知", extra: 0 };
  const sideObj = COMBO_SIDES.find(s => s.n === document.getElementById("comboSideSelect").value) || { n: "未知", extra: 0 };
  curCombo.drink = drinkObj; curCombo.side = sideObj; curCombo.addons = addonObj.n ? [addonObj] : [];
  const total = curCombo.main.comboPrice + drinkObj.extra + sideObj.extra + addonObj.p;
  document.getElementById("currentComboPrice").innerText = total; document.getElementById("currentComboPriceDisplay").innerText = total;
}
function resetCombo() {
  curCombo = { main: null, drink: null, side: null, addons: [] };
  document.getElementById("comboStep1").style.display = "block"; document.getElementById("comboOptionsWrap").style.display = "none";
  document.getElementById("currentComboPriceDisplay").innerText = "0"; renderComboUI();
}
</script>
